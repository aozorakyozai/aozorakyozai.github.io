<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>東京都 ホテル チェックアウト時刻マップ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root{ --pink:#ff3ea5; --red:#e8262c; --blue:#1666d8; --cyan:#00b6d6; --green:#12a150; }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}
  #map{position:absolute;inset:0}
  .panel{position:absolute;z-index:1000;left:10px;top:10px;background:#fff;border-radius:10px;
         box-shadow:0 2px 10px rgba(0,0,0,.25);padding:10px 12px;font-size:13px;max-width:78vw}
  .panel h1{font-size:14px;margin:0 0 6px}
  .legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin:0}
  .legend button{border:0;background:none;padding:0;font:inherit;cursor:pointer;display:flex;align-items:center;gap:5px;color:#222}
  .legend button.off{opacity:.35;text-decoration:line-through}
  .dot{width:13px;height:13px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.35);display:inline-block}
  .hint{margin:6px 0 0;color:#666;font-size:11px;line-height:1.4}
  .leaflet-popup-content{margin:10px 12px;font-size:13px;line-height:1.5;max-width:260px}
  .pop-name{font-weight:700;font-size:14px;margin-bottom:2px}
  .pop-co{display:inline-block;color:#fff;border-radius:4px;padding:1px 7px;font-size:12px;margin:3px 0}
  .pop-memo{white-space:pre-wrap;color:#333;margin-top:4px}
  .pop-a{display:inline-block;margin-top:8px;background:#1666d8;color:#fff;text-decoration:none;
         padding:6px 10px;border-radius:6px;font-size:12px}
  .count{color:#666;font-size:11px}
</style>
</head>
<body>
<div id="map"></div>
<div class="panel">
  <h1>東京都 ホテル チェックアウト時刻マップ <span class="count" id="count"></span></h1>
  <div class="legend" id="legend"></div>
  <p class="hint">ピンをタップすると客室数・宿泊代金・専用乗り場などのメモが出ます。凡例をタップで表示の切替。</p>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const COLORS={pink:"#ff3ea5",red:"#e8262c",blue:"#1666d8",cyan:"#00b6d6",green:"#12a150"};
const LABELS={pink:"10時以前",red:"11時",blue:"12時",cyan:"12時より後",green:"クルーズ船"};
const ORDER=["pink","red","blue","cyan","green"];
const map=L.map('map',{zoomControl:true}).setView([35.68,139.75],12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxZoom:19, attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
const groups={}; ORDER.forEach(c=>groups[c]=L.layerGroup().addTo(map));
const esc=s=>String(s||"").replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
fetch('data.json').then(r=>r.json()).then(items=>{
  const bounds=[];
  items.forEach(h=>{
    const col=COLORS[h.c]||"#666";
    const m=L.circleMarker([h.lat,h.lng],{radius:8,weight:2,color:"#fff",fillColor:col,fillOpacity:1});
    const nav='https://www.google.com/maps/search/?api=1&query='+h.lat+','+h.lng;
    const price=h.price?h.price.toLocaleString()+'円':'';
    m.bindPopup(
      '<div class="pop-name">'+esc(h.name)+'</div>'+
      '<div>'+esc(h.addr)+'</div>'+
      (h.co?'<div><span class="pop-co" style="background:'+col+'">CO '+esc(h.co)+'</span></div>':'')+
      (h.rooms?'<div>客室数 '+h.rooms+'室'+(price?' ／ '+price:'')+(h.pop?' ／ 人気'+h.pop+'位':'')+'</div>':'')+
      (h.note?'<div class="pop-memo">'+esc(h.note)+'</div>':'')+
      (h.c==='green'&&h.memo?'<div class="pop-memo">'+esc(h.memo)+'</div>':'')+
      '<a class="pop-a" href="'+nav+'" target="_blank" rel="noopener">Googleマップで開く</a>');
    m.addTo(groups[h.c]||groups.blue); bounds.push([h.lat,h.lng]);
  });
  if(bounds.length) map.fitBounds(bounds,{padding:[40,40]});
  const counts={}; items.forEach(h=>counts[h.c]=(counts[h.c]||0)+1);
  document.getElementById('count').textContent='（'+items.length+'件）';
  const lg=document.getElementById('legend');
  ORDER.forEach(c=>{
    const n=counts[c]||0;
    const b=document.createElement('button');
    b.innerHTML='<span class="dot" style="background:'+COLORS[c]+'"></span>'+LABELS[c]+' '+n;
    b.onclick=()=>{ if(map.hasLayer(groups[c])){map.removeLayer(groups[c]);b.classList.add('off');}
                    else {map.addLayer(groups[c]);b.classList.remove('off');} };
    if(n===0) b.classList.add('off');
    lg.appendChild(b);
  });
});
</script>
</body>
</html>
